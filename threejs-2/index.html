<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Indoor Plant Corner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="my-canvas"></canvas>
    <div id="help">
        <h1>Indoor Plant Corner</h1>
        <p><b>N</b> Toggle day / night</p>
        <p><b>Click plant</b> or <b>C</b> Change plant color</p>
        <p><b>← →</b> Rotate plant</p>
        <p><b>+ / −</b> Zoom in / out</p>
    </div>
    <script type="module" src="/main.js"></script>
</body>

</html>
